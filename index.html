<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Koios</title>
    <meta name="description" content="Search arXiv, OpenAlex, Semantic Scholar and Crossref for papers or the people who wrote them, collect them, highlight them, and mirror the collection to Google Drive and a Git repository." />
    <link rel="canonical" href="https://koios.dev/" />
    <!-- What a link to the site unfurls as, in a chat or a feed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Koios" />
    <meta property="og:title" content="Koios — a reader and workspace for research papers" />
    <meta property="og:description" content="Find papers across arXiv, OpenAlex, Semantic Scholar and Crossref, read them with their explanation beside them, keep your library in your own Google Drive, and turn a paper into a project." />
    <meta property="og:url" content="https://koios.dev/" />
    <meta property="og:image" content="https://koios.dev/icons/koios-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Koios mark: a bookmark with a star cut out of it" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Koios — a reader and workspace for research papers" />
    <meta name="twitter:description" content="Find papers across arXiv, OpenAlex, Semantic Scholar and Crossref, read them with their explanation beside them, keep your library in your own Google Drive, and turn a paper into a project." />
    <meta name="twitter:image" content="https://koios.dev/icons/koios-512.png" />
    <meta name="twitter:image:alt" content="The Koios mark: a bookmark with a star cut out of it" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The tab's mark: Safari takes the PNGs (it draws no SVG icon), the others the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/koios-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/koios-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/koios.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/koios-180.png" />
    <meta name="theme-color" content="#0e1116" />
    <script>
      // The site's look, as this browser last heard it from the Worker
      // (src/lib/look.ts), applied before the first paint.
      try {
        var look = localStorage.getItem('reader.look') === 'classic' ? 'classic' : 'koios';
        document.documentElement.dataset.look = look;
        // The theme too, so the first paint is already in it (lib/store.tsx applies it again, and follows changes).
        var saved = JSON.parse(localStorage.getItem('reader.settings') || '{}');
        var kept = saved.theme;
        // A theme nobody picked follows the look (lib/store.tsx does the same when it reads the settings).
        if (!saved.themeChosen && (kept === 'dark' || !kept)) kept = null;
        var theme = kept || (look === 'classic' ? 'dark' : 'koios');
        if (theme === 'system') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (theme === 'koios' && look === 'classic') theme = 'dark';
        if (theme === 'koios') {
          document.documentElement.dataset.koios = 'on';
          if (saved.koiosSky !== false) document.documentElement.dataset.sky = 'on';
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.look = 'koios';
        document.documentElement.dataset.koios = 'on';
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="apple-mobile-web-app-title" content="Koios" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- For a reader without JavaScript — a crawler, a text browser, a reviewer's checker: what this is, and where its policies are. -->
    <noscript>
      <main style="max-width: 36rem; margin: 4rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif">
        <h1>Koios</h1>
        <p>A reader and workspace for research papers: find papers, read them with their explanation beside them, keep your library in your own Google Drive, and turn a paper into a project. It needs JavaScript to run.</p>
        <p><a href="/privacy/">Privacy policy</a> · <a href="/terms/">Terms of service</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
