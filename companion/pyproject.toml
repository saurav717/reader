[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reader-companion"
version = "0.11.0"
description = "Connects this computer to the reader's Playground: a Jupyter server the page can reach, paired in one click."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jupyter_server>=2.0", "jupyter_server_terminals>=0.4", "ipykernel>=6", "cryptography>=42"]

[project.scripts]
reader-companion = "reader_companion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reader_companion"]
