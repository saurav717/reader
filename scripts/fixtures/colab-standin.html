<!doctype html>
<!--
  A stand-in for Colab's notebook page, for scripts/colab-tab-smoke.mjs: the
  look of a notebook attached to a runtime — the menu, the toolbar, the
  runtime chip, a cell with its output — drawn here so the Colab tab can be
  photographed and driven where colab.research.google.com cannot be reached
  and no Google account is at hand. Nothing of Google's is used; it is a
  page in Colab's colours. The query string says what it stands for:
  ?attached=1 for a notebook on a runtime, nothing for the front page;
  ?signin=1 for Google's sign-in page in front of it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Untitled0.ipynb - Colab (stand-in)</title>
<style>
  :root { --ink: #202124; --muted: #5f6368; --line: #dadce0; --accent: #1a73e8; --paper: #fff; --panel: #f8f9fa; --orange: #f9ab00; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 Roboto, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--paper); }
  header { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .co { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 24px; border-radius: 12px; background: var(--orange); color: #fff; font: 700 11px sans-serif; letter-spacing: 0.02em; }
  .name { font-size: 18px; }
  .name small { display: block; font-size: 12px; color: var(--muted); }
  .menu { display: flex; gap: 18px; margin-left: 8px; font-size: 13px; color: var(--ink); }
  .spacer { flex: 1; }
  .share { padding: 8px 18px; border-radius: 4px; background: var(--accent); color: #fff; font-weight: 500; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #34a853; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
  .toolbar { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  .toolbar button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font: inherit; color: var(--accent); font-weight: 500; }
  .runtime { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-size: 12px; }
  .runtime .bars { display: inline-flex; gap: 3px; }
  .runtime .bars i { display: inline-block; width: 4px; height: 12px; background: #34a853; border-radius: 1px; }
  .runtime .bars i.dim { background: #dadce0; }
  .runtime .tick { color: #34a853; font-weight: 700; }
  .connect { color: var(--accent); font-weight: 500; }
  main { display: flex; }
  aside { width: 48px; border-right: 1px solid var(--line); min-height: calc(100vh - 100px); display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 18px; color: var(--muted); }
  aside span { display: block; width: 18px; height: 18px; border: 2px solid currentColor; border-radius: 3px; }
  .cells { flex: 1; padding: 20px 40px; max-width: 980px; }
  .cell { display: flex; gap: 10px; margin-bottom: 14px; border: 1px solid transparent; border-radius: 6px; padding: 6px; }
  .cell.focus { border-color: var(--accent); }
  .run { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 10px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .run.busy { border-color: var(--accent); color: var(--accent); }
  .code { flex: 1; }
  pre { margin: 0; padding: 10px 12px; border-radius: 4px; background: var(--panel); font: 13px/1.5 "Roboto Mono", Menlo, monospace; white-space: pre-wrap; }
  .out { margin: 6px 0 0 34px; font: 12.5px/1.5 "Roboto Mono", Menlo, monospace; color: var(--ink); white-space: pre; }
  .k { color: #188038; } .s { color: #c5221f; } .n { color: #1967d2; } .c { color: #5f6368; font-style: italic; }
  .text { margin: 0 0 14px 34px; font-size: 15px; }
  .text h1 { margin: 0 0 6px; font-size: 22px; }
  .signin { max-width: 450px; margin: 60px auto; padding: 40px; border: 1px solid var(--line); border-radius: 8px; text-align: center; }
  .signin h1 { font: 400 24px/1.3 sans-serif; margin: 12px 0 6px; }
  .signin p { color: var(--muted); margin: 0 0 24px; }
  .signin input { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 4px; font: inherit; margin-bottom: 20px; }
  .signin .next { float: right; padding: 9px 24px; border-radius: 4px; background: var(--accent); color: #fff; font-weight: 500; border: 0; }
  .g { font: 700 24px sans-serif; color: #4285f4; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const attached = q.get('attached') === '1';
  const signin = q.get('signin') === '1';
  if (signin) {
    document.write(`
      <div class="signin">
        <div class="g">Google</div>
        <h1>Sign in</h1>
        <p>to continue to Google Colaboratory</p>
        <input placeholder="Email or phone" aria-label="Email or phone">
        <button class="next" onclick="location.search='?attached=1'">Next</button>
      </div>`);
  } else {
    document.write(`
      <header>
        <span class="co">CO</span>
        <div class="name">${attached ? 'Untitled0.ipynb' : 'Welcome To Colab'} <small>${attached ? 'attached to the runtime from Reader' : 'colab.research.google.com'}</small></div>
        <nav class="menu"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Runtime</span><span>Tools</span><span>Help</span></nav>
        <span class="spacer"></span>
        <span class="share">Share</span>
        <span class="avatar">R</span>
      </header>
      <div class="toolbar">
        <button>+ Code</button><button>+ Text</button>
        <span class="spacer"></span>
        ${attached
          ? '<span class="runtime"><span class="tick">✓</span> T4 <span class="bars"><i></i><i></i><i class="dim"></i><i class="dim"></i></span> RAM <span class="bars"><i></i><i class="dim"></i><i class="dim"></i><i class="dim"></i></span> Disk</span>'
          : '<span class="runtime connect">Connect ▾</span>'}
      </div>
      <main>
        <aside><span></span><span></span><span></span><span></span></aside>
        <div class="cells">
          ${attached ? '' : '<div class="text"><h1>Welcome to Colab!</h1>If you are already familiar with Colab, check out this video to learn about interactive tables, the executed code history view, and the command palette.</div>'}
          <div class="cell focus" id="cell1">
            <span class="run" id="run1" title="Run cell" onclick="runIt()">▶</span>
            <div class="code"><pre><span class="c"># the same kernel the reader's cells ran in: what they set is here</span>
<span class="k">import</span> numpy <span class="k">as</span> np
<span class="k">print</span>(<span class="s">"tokens:"</span>, tokens)
<span class="k">print</span>(<span class="s">"attention weights:"</span>, np.round(w, <span class="n">2</span>).tolist())
!nvidia-smi --query-gpu=name,memory.used,memory.total --format=csv,noheader</pre></div>
          </div>
          <div class="out" id="out1">${attached ? '' : ''}</div>
          <div class="cell">
            <span class="run" title="Run cell">▶</span>
            <div class="code"><pre><span class="k">from</span> google.colab <span class="k">import</span> drive
drive.mount(<span class="s">"/content/drive"</span>)   <span class="c"># Drive, on purpose, from Colab's own page</span></pre></div>
          </div>
        </div>
      </main>`);
  }
  function runIt() {
    const run = document.getElementById('run1');
    run.classList.add('busy');
    run.textContent = '■';
    setTimeout(() => {
      document.getElementById('out1').textContent = "tokens: ['the', 'cat', 'sat', 'down']\\nattention weights: [[0.6, 0.1, 0.2, 0.1], [0.02, 0.89, 0.04, 0.05], [0.15, 0.2, 0.56, 0.1], [0.08, 0.3, 0.11, 0.51]]\\nTesla T4, 412 MiB, 15360 MiB";
      run.classList.remove('busy');
      run.textContent = '▶';
    }, 600);
  }
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.shiftKey || event.ctrlKey)) runIt();
  });
</script>
</body>
</html>
