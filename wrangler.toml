name = "reader-arxiv-proxy"
main = "worker/index.js"
compatibility_date = "2025-01-01"
# @cloudflare/puppeteer, which drives the browser below, needs Node's APIs.
compatibility_flags = ["nodejs_compat"]

# The browser inside the reader, from this Worker: Cloudflare's Browser
# Rendering runs a headless Chrome the Worker drives (worker/browse.js). It is
# on the free plan, with a daily allowance of browser time; without this
# binding the Worker says it has no browser and the app explains instead.
[browser]
binding = "BROWSER"

# The session, held open between requests: a Durable Object keeps the one
# connection to that browser and streams its picture, so the pane is as quick
# as from the Node proxy (worker/browserSession.js). SQLite-backed, which is
# what the free plan provides.
[[durable_objects.bindings]]
name = "BROWSER_SESSION"
class_name = "BrowserSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrowserSession"]

# Who uses this Worker's paid accounts, and how much — a tally per person
# per day, kept ninety days (worker/usage.js). `npm run usage` prints it.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "Usage"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Usage"]

# The computers each Google account has connected (worker/devices.js): how
# to reach each one's Reader Companion — its tunnel address and token — so a
# browser signed in as that account finds it from anywhere. One object per
# account; the files stay on the computer.
[[durable_objects.bindings]]
name = "DEVICES"
class_name = "Devices"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Devices"]

# A project shared with the people you work with (worker/projectRoom.js):
# one object per shared project, holding its members, the invitations
# waiting, a summary of the project, and where each member is right now,
# over a WebSocket per open page that hibernates when nobody is typing.
# See docs/live-collaboration.md.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ProjectRoom"

# Mail from the site (server/mail.js): the invitation to a shared project,
# sent to the address invited — whether or not it has ever opened Koios —
# with the project's link. Through Brevo, SendGrid, Postmark or Resend,
# whichever the key is for, from an address the provider has verified — a
# domain, or with Brevo, SendGrid and Postmark one address of your own
# (docs/deploy.md, "Optional: mail"):
#
#     npx wrangler secret put MAIL_API_KEY
#
# and the sender as a var below, exactly as verified. Without them, nothing
# is sent and the share dialog says to send the link by hand.
# MAIL_FROM = "Koios <noreply@example.org>"
# MAIL_PROVIDER = "brevo"        # optional: brevo, sendgrid, postmark or resend; told by the key's shape otherwise
# The Usage page's Email tab (worker/mailUsage.js) measures the mail sent
# against the free plan's sends — Brevo 300 a day, Resend 100 a day and 3,000
# a month, SendGrid's trial 100 a day, Postmark 100 a month. On a paid plan,
# say what it allows:
# MAIL_DAILY_LIMIT = "300"
# MAIL_MONTHLY_LIMIT = "9000"

# Anyone signed in with Google in the reader need paste nothing: the app
# swaps the sign-in for a thirty-day pass signed with READER_TOKEN (see
# server/passes.js and GOOGLE_CLIENT_ID below), so the token is the key the
# passes are signed with as much as a password. READER_EMAILS, a secret,
# limits who may have a pass: addresses and @domains, comma-separated.
# READER_OWNERS, a secret, names the owner's Google email(s): signed in as
# one, they read the usage tally from the rail's chart button and are not
# rate-limited.
#
# The token the reader pastes into Settings → Paper proxy. This Worker's
# address is in the site's JavaScript for anyone to read, and an Origin
# header is a browser's courtesy, not a credential — so what drives the
# browser inside the reader, keeps or uses a sign-in, fetches a file at
# Browserless or asks Scholar through Serply or SerpApi takes this token, and is
# off until it is set. arXiv, open-access PDFs and Scholar asked directly
# need none. Any long random string:
#
#     openssl rand -base64 32 | npx wrangler secret put READER_TOKEN
#
# The session and the cookies of a sign-in are kept per browser that uses
# the reader (an id the site makes up and sends along), never in one jar
# for everyone, and a jar unused for thirty days is dropped.

# How many files a minute one address may ask /pdf for without the token.
# Rate limiting is on every plan; the namespace id is any number unique
# within this account.
# Anyone signed in with Google may use Scholar and the browser inside the
# reader, on this Worker's accounts (see server/passes.js): the app swaps the
# Google sign-in for a thirty-day pass signed with READER_TOKEN. This is how
# many Scholar asks a minute one signed-in person may make — far above what
# searching by hand comes to, and a stop on a script. The owner, with
# READER_TOKEN itself, is not limited.
[[ratelimits]]
name = "PERSON_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# How many Google sign-ins a minute one address may try at /auth/google —
# five, which a person never reaches and a bot does at once. Over it, the
# Worker answers 429 and asks nothing of Google.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "PDF_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# OpenReview papers are fetched from OpenReview's API, which asks an
# anonymous request for a check a Worker cannot pass. Signed in, it asks
# nothing: give the Worker an OpenReview account (README, "OpenReview,
# from its API, signed in") as two secrets:
#
#     npx wrangler secret put OPENREVIEW_USERNAME
#     npx wrangler secret put OPENREVIEW_PASSWORD

# A browser elsewhere, for the sites whose check for a person is Cloudflare's
# — academia.edu, Europe PMC — which Cloudflare's own browser never passes,
# by Cloudflare's design (worker/browserless.js). With a Browserless token
# the Worker still opens Cloudflare's free browser first, and hands the
# session to a browser at Browserless only when a page comes back as that
# check; `/pdf` asks such a file from a Browserless page too. The token is
# a secret, never a var:
#
#     npx wrangler secret put BROWSERLESS_TOKEN
#
# The settings below are optional, and plain vars. The region is the
# nearest of Browserless's; the proxy makes the browser leave from a home
# address, which such a check likes best and which Browserless meters by
# the megabyte on top of the browser time — try without it first. A session
# in the pane runs two minutes on the free plan, which is that plan's cap
# and the default; a paid plan allows more, and the last line raises it.
#
[vars]
# The sender of the site's mail — an invitation to a shared project — as
# verified with the provider whose key is MAIL_API_KEY (server/mail.js).
MAIL_FROM = "Koios <es16btech11007@gmail.com>"
# Which paid Scholar service is asked first when both keys are set; the other
# is asked when it refuses (server/scholarServices.js). "serpapi" reads a
# profile exactly — every work, citations, h-index; "serply" is cheaper, and
# takes the searches, people and versions while SerpApi keeps the profiles.
SCHOLAR_FIRST = "serpapi"
# Reader's meeting notes, recorded on the person's own computer by the Reader
# app with Recall.ai's Desktop Recording SDK (worker/meetings.js, /notes/upload):
# the region the Recall workspace is in. Its key is a secret:
#
#     npx wrangler secret put RECALL_API_KEY
#
# Transcription is Recall's own (recallai_streaming) unless RECALL_TRANSCRIPT
# names a provider set up in the Recall dashboard.
RECALL_API_URL = "https://us-west-2.recall.ai"
# Ask AI and Explain on this Worker's own keys — the site's keys, used by
# anyone who has not pasted one of their own under Settings (server/aiRelay.js,
# server/geminiRelay.js). Each a secret, and each optional:
#
#     npx wrangler secret put ANTHROPIC_KEY    # Claude
#     npx wrangler secret put DEEPSEEK_KEY     # DeepSeek (the Usage page's balance reads it too)
#     npx wrangler secret put GEMINI_KEY       # Gemini
#
# Who may ask on them: "everyone" signed in with Google — what this site
# does, so a visitor needs no key of their own; each person is held to
# PERSON_LIMIT above, and the owner's accounts pay — or "owners" alone:
# READER_TOKEN and the Google accounts in READER_OWNERS. Anyone can still
# paste a key of their own under Settings → AI models, which goes straight
# to its provider, bills their account, and never comes through here.
# (GEMINI_FOR, the setting before this one, is still read for Gemini when
# AI_FOR is unset.)
AI_FOR = "everyone"
# The app's Google OAuth client ID — public, it is in the site's JavaScript.
# A Google sign-in is only taken for a pass when Google says it was made for
# this client; a sign-in some other site obtained is not one to this app.
GOOGLE_CLIENT_ID = "308274983351-s52d0ustml5bneg91ju6of40tmitnaoa.apps.googleusercontent.com"
# The Reader desktop app staying signed in (worker/googleDesktop.js): the
# app signs in through the browser by the code flow and keeps a refresh
# token on the computer; this Worker exchanges and renews with the same
# OAuth client's secret, keeping nothing. On the client in the Google Cloud
# Console: Authorised redirect URIs → https://<this worker>/google/desktop/callback;
# then its secret here:
#
#     npx wrangler secret put GOOGLE_CLIENT_SECRET
#
# Unset, the app signs in the way the site does, an hour at a time.
# A captcha in front of Google sign-in: Cloudflare Turnstile, free. Make a
# widget in the Cloudflare dashboard (Turnstile → Add widget, hostname
# koios.dev and localhost), put its site key here — it is public,
# /health hands it to the app, which draws the widget on the sign-in screen —
# and its secret key as a secret:
#
#     npx wrangler secret put TURNSTILE_SECRET
#
# With both set, a sign-in is swapped for a pass only with a fresh Turnstile
# answer; renewing a pass that is still good needs none. With either unset,
# there is no captcha and LOGIN_LIMIT above is the only brake.
# TURNSTILE_SITE_KEY = "0x4AAAAAAA…"
# BROWSERLESS_URL = "wss://production-sfo.browserless.io"   # or -lon, -ams
BROWSERLESS_PROXY = "residential"
BROWSERLESS_COUNTRY = "us"
# BROWSERLESS_SESSION_MS = "600000"
#
# Where the session object that holds the browser lives. Left unset it is
# made near whoever first opened the pane, which is far from a browser at
# Browserless, and every frame and every click crosses that distance twice
# (worker/index.js). Set it to the region of the browser instead — wnam
# for Browserless's San Francisco, weur for London or Amsterdam — and the
# object sits next to the browser; the one long hop left is the pane's,
# which the stream (a WebSocket) pays once per frame, not once per poll.
#
BROWSER_SESSION_LOCATION = "wnam"

# The LaTeX compiler on Google Cloud Run (cloudrun/latex, worker/latex.js):
# its address, as cloudrun/latex/deploy.sh prints it (project reader-509409,
# us-central1), and what it was given.
# With it and the secret LATEX_CLOUD_RUN_TOKEN, compiles go there rather
# than to GitHub Actions (docs/deploy.md).
#
LATEX_CLOUD_RUN_URL = "https://reader-latex-fgk7igwsuq-uc.a.run.app"
LATEX_CLOUD_RUN_CPU = "2"
LATEX_CLOUD_RUN_MEMORY_GIB = "4"

# The Usage page's Google Cloud tab (worker/gcloud.js): the project's billing
# account, its Cloud Run services and VMs with Start and Stop, and its cost and
# transactions. It reads the project as a service account whose JSON key is
# the secret GCP_SERVICE_ACCOUNT_KEY (docs/deploy.md, "Google Cloud on the
# Usage page"); without it the tab says how to connect one. The project is the
# key's own unless GCP_PROJECT names another; Cloud Run is listed in
# GCP_REGIONS (us-central1 unless set); cost and transactions need the billing
# export to BigQuery, named in GCP_BILLING_EXPORT_TABLE.
#
# GCP_PROJECT = "reader-509409"
# GCP_REGIONS = "us-central1"
GCP_BILLING_EXPORT_TABLE = "reader-509409.billing_export.gcp_billing_export_v1_017A1A_D5F3BA_E6D8A0"

# The Usage page's Cloudflare tab (worker/cloudflare.js): today's Workers,
# Durable Objects, KV and browser time against the Free plan's daily limits.
# The browser's time needs nothing more; the rest is read from Cloudflare's
# analytics with an API token that has "Account Analytics: Read", a secret,
# and this account's ID (docs/deploy.md, "Cloudflare on the Usage page"):
#
#     npx wrangler secret put CLOUDFLARE_API_TOKEN
#
# CLOUDFLARE_ACCOUNT_ID = "…"   # dashboard → Workers & Pages → Account details

# Somewhere to keep the cookies of a sign-in made in that browser, so it
# holds for the next paper and lets /pdf through a login wall — and so the
# browser, which Cloudflare rations, is not needed again for a publisher
# already signed in to. Make the namespace once, on the account the Worker
# deploys to:
#
#     npx wrangler kv namespace create SESSIONS
#
# It prints an id, which is the one below; a Worker deployed to another
# account needs that account's own. To do without it, comment the three
# lines out: a sign-in then lasts as long as the browser session.
[[kv_namespaces]]
binding = "SESSIONS"
id = "4b383f85f5d041569dc04f04350b1c38"

# Ask AI's Web button: with it on, the model may search the web and read
# pages through this Worker (server/webSearch.js). The search is asked of
# the first of these keys that is set — Tavily, made for exactly this and
# free for a thousand searches a month (app.tavily.com), then Brave's
# Search API, then the Serply or SerpApi key Scholar already has:
#
#     npx wrangler secret put TAVILY_KEY
#
# Each search is metered on that account, for whoever may use this Worker's
# paid accounts, under PERSON_LIMIT above. Without any, the button in the
# app says the proxy has no search key.

# People's tokens (an Overleaf account's Git token and email, a GitHub token
# and its login) kept sealed in SESSIONS, with a key used for nothing else
# (worker/secrets.js, docs/deploy.md). Set it before the deploy that needs it,
# and keep a copy: a new one can't open what the old one sealed.
#
#     openssl rand -base64 32 | npx wrangler secret put SECRETS_KEY
#
# Optional, each: the sign-ins Projects → Connections → GitHub offers beside a
# pasted token (docs/deploy.md, "Sign in with GitHub, and Reader's GitHub App").
#
#     npx wrangler secret put GITHUB_APP_CLIENT_ID
#     npx wrangler secret put GITHUB_APP_CLIENT_SECRET
#     npx wrangler secret put GITHUB_APP_SLUG
#     npx wrangler secret put GITHUB_OAUTH_CLIENT_ID
#     npx wrangler secret put GITHUB_OAUTH_CLIENT_SECRET
#
# LaTeX compiled for anyone signed in (worker/latex.js), on Cloud Run — its
# address in [vars] above, and its secret:
#
#     npx wrangler secret put LATEX_CLOUD_RUN_TOKEN  # also the repository secret of that name
#
# or, where there is no Cloud Run, on GitHub Actions in the reader's own
# repository (.github/workflows/latex-compile.yml): the jobs are kept in
# SESSIONS above, for an hour at most. Two secrets, both needed
# (docs/deploy.md, "the LaTeX compiler"):
#
#     npx wrangler secret put LATEX_RUNNER_TOKEN   # also a repository secret of that name
#     npx wrangler secret put LATEX_GITHUB_TOKEN   # fine-grained, Actions: read and write on the repository
#
# LATEX_REPO = "saurav717/reader"   # where the workflow is, if not here
#
# Each job's state (queued, compiling, done) is in a Durable Object of its own,
# so the page sees it change at once — KV can hand it a reading a minute old.
[[durable_objects.bindings]]
name = "LATEX_JOBS"
class_name = "LatexJob"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["LatexJob"]

# The rooms of shared projects (worker/projectRoom.js): the ROOMS binding above.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["ProjectRoom"]

# The invitations ledger (worker/invites.js): who invited whom, by project,
# mail or a personal link, and whether it took — the projects waiting for
# someone on Home, and the owner's Invitations tab on the Usage page.
[[durable_objects.bindings]]
name = "INVITES"
class_name = "Invites"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Invites"]

# Once an hour, a snapshot of the DeepSeek account's balance and of the
# Tavily key's usage for the Usage page (worker/deepseekBalance.js,
# worker/tavilyUsage.js). Does nothing until DEEPSEEK_KEY or TAVILY_KEY is set:
#   npx --yes wrangler@4 secret put DEEPSEEK_KEY
[triggers]
crons = ["17 * * * *"]
