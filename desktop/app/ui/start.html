<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>Koios</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="start.css">
</head>
<body>
<main>
  <img class="icon" src="../build/icon.png" alt="">
  <h1 id="status">Starting Koios…</h1>
  <p id="note">Koios starts its Companion, which runs your code on this computer.</p>
  <div class="bar" id="bar"></div>
  <pre class="log" id="log" hidden></pre>
  <div class="actions" id="actions" hidden>
    <button type="button" id="log-file">Show the log</button>
    <button type="button" id="without">Open Koios without it</button>
    <button type="button" class="primary" id="retry">Try again</button>
  </div>
</main>
<script src="start.js"></script>
</body>
</html>
