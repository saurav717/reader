# Deploys the proxy: each merge into main that changes the Worker (worker/,
# server/, wrangler.toml) runs `wrangler deploy`, as `npm run deploy:worker`
# does by hand. A pull request that changes it builds it with --dry-run, to
# check, and deploys nothing. The Worker's secrets (READER_TOKEN,
# READER_OWNERS, the keys) stay as they are: deploying never touches them.
#
# It needs two secrets (see docs/deploy.md):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account the Worker is in
# Without them a merge says so and deploys nothing.
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'server/**', 'wrangler.toml', '.github/workflows/deploy-worker.yml']
  pull_request:
    paths: ['worker/**', 'server/**', 'wrangler.toml', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Test the Worker
        run: node --test scripts/usage.test.mjs scripts/passes.test.mjs scripts/devices.test.mjs scripts/latex-github.test.mjs scripts/secrets.test.mjs scripts/github-token.test.mjs scripts/moves.test.mjs

      - name: Build it, deploying nothing
        if: github.event_name == 'pull_request'
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      - name: Without the Cloudflare token, nothing to deploy
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN isn't set, so the Worker isn't deployed from here (docs/deploy.md). npm run deploy:worker does it by hand."

      # The bucket a project's files pass through on a move (worker/moves.js, docs/storage-moves.md): made the first
      # time, so the deploy that binds it finds it. The token needs "Workers R2 Storage: Edit", which the Edit
      # Cloudflare Workers template has.
      - name: The R2 bucket for moves, made once
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 r2 bucket list | grep -q 'reader-moves' || npx --yes wrangler@4 r2 bucket create reader-moves

      - name: Deploy it
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 deploy
          echo "### Deployed the Worker (reader-arxiv-proxy) from saurav717/reader@${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          # Its names only, never the values: without SECRETS_KEY the Worker keeps no one's tokens (docs/deploy.md).
          if ! npx --yes wrangler@4 secret list | grep -q '"SECRETS_KEY"'; then
            echo "::warning::The Worker has no SECRETS_KEY secret: connecting Overleaf or GitHub is refused until it has one. openssl rand -base64 32 | npx wrangler secret put SECRETS_KEY"
          fi
