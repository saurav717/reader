# Publishes the site: each merge into main builds it (npm run build:pages, with
# the site's Worker compiled in) and publishes the build as this repository's
# own GitHub Pages site, which serves it at https://koios.dev/. So merging a
# pull request here is all a change needs.
#
# It needs no token: GitHub's own Pages deployment takes the build from this
# run. Once, in Settings → Pages, the source must be "GitHub Actions" and the
# custom domain koios.dev (see docs/deploy.md); until then the deploy step
# fails and says so, and the build itself still runs.
name: Deploy site

on:
  push:
    branches: [main]
  # A pull request builds the site, to check it, and publishes nothing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the site
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build:pages
          grep -q "reader-arxiv-proxy" dist-pages/assets/index-*.js || { echo "::error::The build has no proxy address in it"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - run: echo "### Published saurav717/reader@${GITHUB_SHA::7} to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
