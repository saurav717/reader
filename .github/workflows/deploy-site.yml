# Publishes the site: each merge into main builds it (npm run build:pages, with
# the site's Worker compiled in) and puts it in saurav717/saurav717.github.io
# under reader/, which GitHub Pages serves at https://saurav717.github.io/reader/.
# So merging a pull request here is all a change needs; there's no site pull
# request to merge as well.
#
# It needs one secret, SITE_DEPLOY_TOKEN: a fine-grained personal access token
# with "Contents: Read and write" on saurav717/saurav717.github.io only (see
# docs/deploy.md). Without it this run says so and does nothing.
name: Deploy site

on:
  push:
    branches: [main]
  # A pull request builds the site, to check it, and publishes nothing.
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
      PUBLISH: ${{ github.event_name != 'pull_request' && secrets.SITE_DEPLOY_TOKEN != '' }}
    steps:
      - name: Without the token, nothing to publish
        if: github.event_name != 'pull_request' && env.SITE_DEPLOY_TOKEN == ''
        run: echo "::notice::SITE_DEPLOY_TOKEN isn't set, so the site isn't published from here (docs/deploy.md)."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the site
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build:pages
          grep -q "reader-arxiv-proxy" dist-pages/assets/index-*.js || { echo "::error::The build has no proxy address in it"; exit 1; }

      - uses: actions/checkout@v4
        if: env.PUBLISH == 'true'
        with:
          repository: saurav717/saurav717.github.io
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site

      - name: Publish it under reader/
        if: env.PUBLISH == 'true'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cd site
          # reader/ is the build, and only the build; SETUP.md there is the site's own.
          [ -f reader/SETUP.md ] && cp reader/SETUP.md "$RUNNER_TEMP/SETUP.md"
          rm -rf reader
          cp -r ../dist-pages reader
          [ -f "$RUNNER_TEMP/SETUP.md" ] && cp "$RUNNER_TEMP/SETUP.md" reader/SETUP.md
          git add -A reader
          if git diff --cached --quiet; then
            echo "The site is already this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Reader: build of saurav717/reader@${GITHUB_SHA::7}" -m "${MESSAGE:-}"
          git push
          echo "### Published saurav717/reader@${GITHUB_SHA::7} to https://saurav717.github.io/reader/" >> "$GITHUB_STEP_SUMMARY"
