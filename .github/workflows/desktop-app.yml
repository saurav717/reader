# Builds the Koios desktop app (desktop/app, Electron) and its installers, on each system's own runner:
#   macOS    Koios-<version>.dmg                     one universal app (Apple silicon and Intel)
#   Windows  Koios-Setup-<version>.exe               a setup wizard; uninstalled from Settings → Apps
#   Linux    Koios-<version>-x86_64.AppImage, koios_<version>_amd64.deb, koios-<version>.x86_64.rpm
# (Reader-… until 0.16, when the app was called Reader.)
# and what the app updates itself from (desktop/app/updates.js): latest-mac.yml and Koios-<version>-mac.zip,
# latest.yml and the .exe's .blockmap, latest-linux.yml.
#
# <version> is the Companion's major.minor (companion/pyproject.toml) and this run's number — 0.14.312 —
# so each release is newer than the one before and the app can tell; a tag app-v<version> names its own.
#
# Every run uploads the installers as artifacts. A pull request only builds them, to check. A merge
# into main that touches the app or the Companion publishes them as a new GitHub Release,
# app-v<version>, as does a tag app-v* or a manual run with "release" ticked. Every version stays
# published, for every system (github.com/saurav717/reader/releases); the newest is "Latest", which is
# what the site's "Download for …" offers (src/lib/companion.ts) and what the app updates to.
#
# Signing, all optional (Settings → Secrets and variables → Actions), see docs/desktop-app.md:
#   MACOS_CERTIFICATE           your Developer ID Application certificate, a .p12, base64
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_ID                    the Apple Account of the developer membership
#   APPLE_TEAM_ID               its Team ID (10 characters)
#   APPLE_APP_PASSWORD          an app-specific password for it (account.apple.com)
#   WINDOWS_CERTIFICATE         a code signing certificate for Windows, a .pfx, base64
#   WINDOWS_CERTIFICATE_PASSWORD  its password
# Without them the .dmg is named Koios-<version>-unsigned.dmg (macOS stops it once) and the .exe
# Koios-Setup-<version>-unsigned.exe (Windows SmartScreen warns once).
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the installers as a GitHub Release
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['app-v*']
    paths: ['desktop/app/**', 'companion/**', 'scripts/build-companion.mjs', '.github/workflows/desktop-app.yml']
  pull_request:
    paths: ['desktop/app/**', 'companion/**', 'scripts/build-companion.mjs', '.github/workflows/desktop-app.yml']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/app-v*) VERSION="${GITHUB_REF_NAME#app-v}" ;;
            *)
              COMPANION="$(sed -n 's/^version = "\(.*\)"/\1/p' companion/pyproject.toml)"
              VERSION="$(echo "$COMPANION" | cut -d. -f1-2).${{ github.run_number }}" ;;
          esac
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Koios $VERSION" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      READER_APP_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Tools for the .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - name: The Companion and uv, inside the app
        run: node scripts/prepare-companion.mjs

      - name: Signing, when the secrets are set
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # electron-builder reads these (a base64 certificate in CSC_LINK is fine). Nothing set: unsigned.
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MACOS_CERTIFICATE" ]; then
            {
              echo "CSC_LINK=$MACOS_CERTIFICATE"
              echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
                echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_PASSWORD"
              } >> "$GITHUB_ENV"
            else
              echo "SIGNED=" >> "$GITHUB_ENV" # signed but not notarized still makes macOS stop it
            fi
          elif [ "$RUNNER_OS" = Windows ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            {
              echo "CSC_LINK=$WINDOWS_CERTIFICATE"
              echo "CSC_KEY_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          # electron-builder names the .dmg and the .exe …-unsigned without a certificate (or, on a Mac, without notarizing),
          # so the update files (latest*.yml) name them as they are published.
          if [ "$RUNNER_OS" != Linux ] && [ "$(grep '^SIGNED=' "$GITHUB_ENV" | tail -n 1)" != SIGNED=yes ]; then echo "READER_UNSIGNED=1" >> "$GITHUB_ENV"; fi

      - name: Build the installers
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never

      - name: Gather them for the release
        run: |
          mkdir -p out
          VERSION="$READER_APP_VERSION"
          SUFFIX=""; [ -z "$READER_UNSIGNED" ] || SUFFIX="-unsigned"
          case "$RUNNER_OS" in
            macOS)
              cp "dist/Koios-$VERSION$SUFFIX.dmg" "dist/Koios-$VERSION-mac.zip" dist/latest-mac.yml out/ ;;
            Windows)
              cp "dist/Koios-Setup-$VERSION$SUFFIX.exe" "dist/Koios-Setup-$VERSION$SUFFIX.exe.blockmap" dist/latest.yml out/ ;;
            Linux)
              cp "dist/Koios-$VERSION-x86_64.AppImage" "dist/koios_${VERSION}_amd64.deb" "dist/koios-$VERSION.x86_64.rpm" dist/latest-linux.yml out/ ;;
          esac
          # The update files name what is published beside them, with the version the app compares against its own.
          for yml in out/latest*.yml; do
            cat "$yml"
            grep -q "^version: $VERSION\$" "$yml"
            for file in $(sed -n 's/^ *- url: //p' "$yml"); do [ -f "out/$file" ] || { echo "$yml names $file, which isn't published"; exit 1; }; done
          done
          ls -la out
          {
            echo "### $RUNNER_OS"
            for file in out/*; do echo "- $(basename "$file") ($(du -h "$file" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          VERSION="$READER_APP_VERSION"
          dpkg-deb -I "out/koios_${VERSION}_amd64.deb"
          # It takes the place of the reader package (the app's name until 0.16).
          dpkg-deb -f "out/koios_${VERSION}_amd64.deb" Replaces Conflicts | grep -q reader
          dpkg-deb -c "out/koios_${VERSION}_amd64.deb" | grep -E 'resources/companion/(uv|info.json|reader_companion-.*\.whl|python/.*x86_64-unknown-linux-gnu.*\.tar\.gz)'
          rpm -qip "out/koios-$VERSION.x86_64.rpm"

      - name: Check the app on macOS
        if: runner.os == 'macOS'
        run: |
          APP="dist/mac-universal/Koios.app"
          codesign --verify --verbose=2 "$APP" || true
          lipo -archs "$APP/Contents/MacOS/Koios"
          lipo -archs "$APP/Contents/Resources/companion/uv"
          "$APP/Contents/Resources/companion/uv" --version
          ls "$APP"/Contents/Resources/companion/python/*/ | grep -c 'apple-darwin' | grep -qx 2 # Python for both Apple silicon and Intel
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'
          plutil -p "$APP/Contents/Info.plist" | grep -q "\"CFBundleShortVersionString\" => \"$READER_APP_VERSION\""
          test -f "$APP/Contents/Resources/app-update.yml" && cat "$APP/Contents/Resources/app-update.yml"

      - name: Check Safari's certificate on a real Mac
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          # The certificate the Companion makes (companion/reader_companion/tls.py), trusted as setup
          # trusts it: trustRoot, for SSL. Setup trusts it in the login keychain, which needs a person
          # to type a password; a runner has none, so the system domain (sudo, -d) stands in.
          export READER_COMPANION_HOME="$RUNNER_TEMP/companion-home"
          UV=desktop/app/companion/uv
          CERT="$("$UV" run --quiet --python 3.12 --with cryptography python -c "import sys; sys.path.insert(0, 'companion'); from reader_companion import tls; tls.ensure_certificate(); print(tls.cert_path())")"
          sudo security add-trusted-cert -d -r trustRoot -p ssl -k /Library/Keychains/System.keychain "$CERT"
          security verify-cert -c "$CERT" -p ssl -s localhost
          security verify-cert -c "$CERT" -p ssl -s 127.0.0.1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-${{ runner.os }}
          path: desktop/app/out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || startsWith(github.ref, 'refs/tags/app-v') || inputs.release
    runs-on: ubuntu-latest
    # One release at a time, in order: the newest is published last, so it is the one marked Latest.
    concurrency:
      group: desktop-app-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          COMPANION="$(sed -n 's/^version = "\(.*\)"/\1/p' companion/pyproject.toml)"
          TAG="app-v$VERSION"
          NOTES="Koios $VERSION as an app: its own window, no browser needed, with the Koios Companion $COMPANION set up the first time it opens. An app already installed updates itself to it (Check for Updates… in the Koios menu on a Mac, in Help elsewhere); older versions stay on the releases page. The app was called Reader until 0.16. On a Mac that has the Reader app, download this one once (Reader can't update itself into the new name), drag Koios to Applications, then delete Reader: your sign-ins and settings carry over.

          - **macOS**: open the .dmg and drag Koios to Applications. To uninstall: Koios menu → Uninstall Koios…
          - **Windows**: run Koios-Setup (it installs over Reader). To uninstall: Settings → Apps → Koios → Uninstall.
          - **Linux**: the .deb (Ubuntu, Debian), the .rpm (Fedora, openSUSE) or the AppImage (any). To uninstall: Uninstall Koios in your applications, or sudo apt remove koios.

          An installer named …-unsigned isn't signed: macOS stops it once (Done, then Open Anyway in System Settings → Privacy & Security), and Windows asks once (More info → Run anyway)."
          ls -la installers
          # A new release for every version, so every one stays downloadable; its changes since the last listed after
          # the notes. Run again for the same version (a re-run), its files are replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --title "Koios $VERSION" --notes "$NOTES" --generate-notes --latest
          fi
